name: Debian IPA
permissions:
  contents: read
  actions: read
concurrency:
  group: debian-ipa-${{ github.sha }}
  cancel-in-progress: false
jobs:
  inputs:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.plan.outputs.app }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - id: plan
      env:
        BEFORE: ${{ github.event.before }}
      run: |
        BEFORE=${BEFORE:-$(git rev-parse HEAD^)}
        python3 -B tools/ci/debian-inputs.py --before "$BEFORE" --output plan.json --github-output "$GITHUB_OUTPUT"
    - uses: actions/upload-artifact@v4
      with:
        name: ipa-input-plan
        path: plan.json
    - name: Verify product selection and cache input boundaries
      run: python3 -B tests/tooling/kernarium/test_debian_inputs.py -v
  build:
    needs: inputs
    if: needs.inputs.outputs.app == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
        - sdk: device
          platform: ios
          directory: ios-device-arm64
          legacy: ios
        - sdk: simulator
          platform: ios-simulator
          directory: ios-simulator-arm64
          legacy: sim
    runs-on: xcode-27
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Reuse accepted kernel and boot base with source and digest verification
      run: python3 -B tools/ci/stage-debian-runtime.py
    - uses: ./.github/actions/apple-runtime
      with:
        sdk: ${{ matrix.sdk }}
        platform: ${{ matrix.platform }}
        platform-directory: ${{ matrix.directory }}
        legacy-prefix: ${{ matrix.legacy }}
    - name: Build unsigned device application
      if: matrix.sdk == 'device'
      run: |
        xcodebuild -project Kernarium/Kernarium.xcodeproj -scheme Kernarium -configuration Release \
          -destination 'generic/platform=iOS' -derivedDataPath "$PWD/.build/iphone-derived" -jobs 3 \
          CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
        mkdir -p .build/ipa/Payload
        cp -R .build/iphone-derived/Build/Products/Release-iphoneos/Kernarium.app .build/ipa/Payload/
        (cd .build/ipa && zip -qry "$RUNNER_TEMP/Kernarium-Debian.ipa" Payload)
        unzip -t "$RUNNER_TEMP/Kernarium-Debian.ipa"
        python3 - <<'PY'
        import zipfile, os
        from pathlib import Path
        with zipfile.ZipFile(Path(os.environ['RUNNER_TEMP']) / 'Kernarium-Debian.ipa') as archive:
            names = archive.namelist()
            assert 'Payload/Kernarium.app/Kernarium' in names
            assert any('/KRuntime_6_18_4K.framework/' in n for n in names)
        PY
        mkdir -p "$RUNNER_TEMP/ipa-release"
        cp -c "$RUNNER_TEMP/Kernarium-Debian.ipa" "$RUNNER_TEMP/ipa-release/"
        python3 -B tools/ci/debian-artifacts.py record --root "$RUNNER_TEMP/ipa-release" --kind ipa --key "$GITHUB_SHA"
        python3 -B tools/ci/debian-artifacts.py verify --root "$RUNNER_TEMP/ipa-release" --kind ipa --key "$GITHUB_SHA"
        cp -c "$RUNNER_TEMP/ipa-release/provenance.json" "$RUNNER_TEMP/provenance.json"
    - name: Build the matching Simulator test host
      if: matrix.sdk == 'simulator'
      run: |
        xcodebuild build-for-testing -project Kernarium/Kernarium.xcodeproj -scheme Kernarium -configuration Release \
          -destination 'generic/platform=iOS Simulator' -derivedDataPath "$PWD/.build/simulator-derived" -jobs 3 \
          ENABLE_TESTABILITY=YES CODE_SIGNING_ALLOWED=NO EXCLUDED_ARCHS=x86_64
        python3 -B tools/ci/debian-artifacts.py record --root .build/simulator-derived/Build/Products --kind app-test-host --key "$GITHUB_SHA"
        tar -C .build/simulator-derived/Build -czf "$RUNNER_TEMP/debian-app-test-host.tar.gz" Products
    - uses: actions/upload-artifact@v4
      with:
        name: app-${{ matrix.sdk }}
        path: |
          ${{ runner.temp }}/Kernarium-Debian.ipa
          ${{ runner.temp }}/debian-app-test-host.tar.gz

          ${{ runner.temp }}/provenance.json
        if-no-files-found: error
        compression-level: 0
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: apple-cache-${{ matrix.sdk }}
        path: apple-cache-*.json
        if-no-files-found: warn
  tests:
    needs: build
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: app-simulator
        path: ${{ runner.temp }}/host
    - name: Verify the matching application test host
      run: |
        XCODE_PATH=$(python3 -c 'import pathlib; p=sorted(pathlib.Path("/Applications").glob("Xcode_27*.app")); print(p[-1] if p else "/Applications/Xcode.app")')
        sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
        mkdir -p .build/test-host
        tar -C .build/test-host -xzf "$RUNNER_TEMP/host/debian-app-test-host.tar.gz"
        python3 -B tools/ci/debian-artifacts.py verify --root .build/test-host/Products --kind app-test-host --key "$GITHUB_SHA"
    - name: Clipboard, native selection and terminal resize tests
      run: python3 -B tools/ci/run-debian-simulator.py --state "$RUNNER_TEMP/simulator-state.json" --products .build/test-host/Products --suite DebianAppTests --output "$RUNNER_TEMP/app-results"
    - name: JIT preference, boot request and real Simulator fallback
      run: |
        rm -f .build/test-host/Products/selected.xctestrun
        python3 -B tools/ci/run-debian-simulator.py --state "$RUNNER_TEMP/simulator-state.json" --products .build/test-host/Products --suite GuestJITTests --output "$RUNNER_TEMP/jit-results"
    - name: Check modifier reset through the application's visible controls
      run: |
        rm -f .build/test-host/Products/selected.xctestrun
        python3 -B tools/ci/run-debian-simulator.py --state "$RUNNER_TEMP/simulator-state.json" --products .build/test-host/Products --ui-case KernariumUITests/testGraphicalModifiersAreReleasedWhenChangingModes --output "$RUNNER_TEMP/ui-results"
    - name: Fetch a previously boot-qualified Phosh disk without building any image
      run: python3 -B tools/ci/qualified-debian-image.py --wait-seconds 1800 --output "$RUNNER_TEMP/golden-image"
    - name: Preserve the original real Phosh-to-console persistence smoke
      run: |
        rm -f .build/test-host/Products/selected.xctestrun
        python3 -B tools/ci/run-debian-simulator.py --state "$RUNNER_TEMP/simulator-state.json" --products .build/test-host/Products --image "$RUNNER_TEMP/golden-image/debian-13-phosh.img" --suite PersistentDebianTests --output "$RUNNER_TEMP/persistent-results"
    - name: Check tmux panes and status from rendered screen pixels
      run: |
        rm -f .build/test-host/Products/selected.xctestrun
        python3 -B tools/ci/run-debian-simulator.py --state "$RUNNER_TEMP/simulator-state.json" --products .build/test-host/Products --image "$RUNNER_TEMP/golden-image/debian-13-phosh.img" --suite DebianMobileTests --single-phase --output "$RUNNER_TEMP/mobile-results"
    - name: Increase the disk before boot and check ext4 and data across two reboots
      run: |
        rm -f .build/test-host/Products/selected.xctestrun
        python3 -B tools/ci/run-debian-simulator.py --state "$RUNNER_TEMP/simulator-state.json" --products .build/test-host/Products --image "$RUNNER_TEMP/golden-image/debian-13-phosh.img" --suite DebianStorageTests --storage --output "$RUNNER_TEMP/storage-results"
    - name: Record actual complete application qualification
      run: |
        python3 - <<'PYTHON'
        import json, os
        from pathlib import Path
        root=Path(os.environ['RUNNER_TEMP'])
        tests={str(path.relative_to(root)):json.loads(path.read_text()) for folder in ('app-results','jit-results','ui-results','persistent-results','mobile-results','storage-results') for path in (root/folder).glob('*-summary.json')}
        assert len(tests)==9, tests
        for summary in tests.values():
            assert summary['totalTestCount']>0 and summary['passedTests']==summary['totalTestCount']
            assert summary['failedTests']==summary['skippedTests']==0
        qualification=dict(kind='ipa',source_revision=os.environ['GITHUB_SHA'],run_id=os.environ['GITHUB_RUN_ID'],image=json.loads((root/'golden-image/selected-image.json').read_text()),tests=tests)
        (root/'app-qualification.json').write_text(json.dumps(qualification,indent=2)+'\n')
        PYTHON
    - uses: actions/upload-artifact@v4
      with:
        name: ipa-qualification
        path: ${{ runner.temp }}/app-qualification.json
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ipa-test-diagnostics
        path: |
          ${{ runner.temp }}/app-results/
          ${{ runner.temp }}/ui-results/
          ${{ runner.temp }}/persistent-results/
          ${{ runner.temp }}/mobile-results/
          ${{ runner.temp }}/storage-results/

          ${{ runner.temp }}/jit-results/
        if-no-files-found: warn
    - name: Clean up the shared test Simulator
      if: always()
      run: python3 -B tools/ci/run-debian-simulator.py --cleanup --state "$RUNNER_TEMP/simulator-state.json" --products .build/test-host/Products --output "$RUNNER_TEMP/cleanup"
  timings:
    if: always()
    needs:
    - inputs
    - build
    - tests
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
    - uses: actions/checkout@v4
    - name: Report actual stage durations
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 -B tools/ci/debian-run-report.py
    - uses: actions/upload-artifact@v4
      with:
        name: ipa-stage-times
        path: debian-stage-times.json
'on':
  push:
    branches:
    - debian-phosh
  workflow_dispatch: null
