# SPDX-License-Identifier: GPL-2.0-or-later
name: Debian IPA
permissions:
  contents: read
  actions: read
concurrency:
  group: debian-ipa-${{ github.sha }}
  cancel-in-progress: false
jobs:
  inputs:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.plan.outputs.app }}
      runtime_tests: ${{ steps.plan.outputs.runtime_tests }}
      phosh_key: ${{ steps.plan.outputs.phosh_key }}
      sdk_key: ${{ steps.sdk-cache.outputs.cache-matched-key }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - id: plan
      env:
        BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: |
        BEFORE=${BEFORE:-$(git rev-parse HEAD^)}
        python3 -B tools/ci/debian-inputs.py --before "$BEFORE" --output plan.json --github-output "$GITHUB_OUTPUT"
    - uses: actions/upload-artifact@v4
      with:
        name: ipa-input-plan
        path: plan.json
    - name: Verify product selection and cache input boundaries
      run: python3 -B tests/tooling/kernarium/test_debian_inputs.py -v
    - name: Verify guest display geometry and metadata policy
      run: python3 -B tests/tooling/kernarium/test_display_session.py -v
    - name: Verify Node snapshot reuse boundaries and integrity
      run: timeout 60 python3 -B tests/tooling/kernarium/test_node_experiment.py
    - name: Audit source contracts before dependency and application builds
      run: cmake -DSOURCE_ROOT="$PWD" -P scripts/audit-source-tree.cmake
    - name: Check the xtool packaging adapter
      run: timeout 60 python3 -B tests/tooling/kernarium/test_xtool.py
    - uses: actions/cache/restore@v4
      id: sdk-cache
      with:
        path: .build/xtool-sdk-input
        key: xtool-sdk-v1-${{ hashFiles('tools/ci/xtool/export-sdk.py') }}-lookup
        restore-keys: xtool-sdk-v1-${{ hashFiles('tools/ci/xtool/export-sdk.py') }}-
        lookup-only: true
  sdk:
    needs: inputs
    if: needs.inputs.outputs.app == 'true' && needs.inputs.outputs.sdk_key == ''
    runs-on: xcode-27
    timeout-minutes: 30
    outputs:
      key: ${{ steps.identity.outputs.key }}
    steps:
    - uses: actions/checkout@v4
    - name: Identify the installed SDK without compiling
      id: identity
      run: |
        XCODE_PATH=$(python3 -c 'import pathlib; p=sorted(pathlib.Path("/Applications").glob("Xcode_27*.app")); print(p[-1] if p else "/Applications/Xcode.app")')
        sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
        xcodebuild -version
        xcrun --sdk iphoneos --show-sdk-version | awk -F. '$1 >= 27 { ok=1 } END { exit !ok }'
        SDK_ID=$(xcodebuild -version | shasum -a 256 | cut -c1-64)
        echo "key=xtool-sdk-v1-${{ hashFiles('tools/ci/xtool/export-sdk.py') }}-$SDK_ID" >> "$GITHUB_OUTPUT"
    - name: Copy the SDK inputs for the Linux compiler
      run: |
        python3 -B tools/ci/xtool/export-sdk.py --developer "$(xcode-select -p)" --output .build/xtool-sdk-input
        python3 -B tools/ci/debian-artifacts.py record --root .build/xtool-sdk-input --kind xtool-sdk --key "${{ steps.identity.outputs.key }}"
    - uses: actions/cache/save@v4
      with:
        path: .build/xtool-sdk-input
        key: ${{ steps.identity.outputs.key }}
  node-image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    outputs:
      image_key: ${{ steps.node-key.outputs.key }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Install the image producer tools
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends build-essential cpio curl debootstrap e2fsprogs erofs-utils gdisk gzip python3 sudo tar xz-utils zip
    - name: Check the rewriter and executable windows
      run: |
        timeout 120 python3 -B tests/tooling/arm64/test_aot_tools.py
        timeout 60 python3 -B tests/tooling/arm64/test_linux_node_aot.py
        timeout 120 python3 -B tests/tooling/cmake/check_environment_portability.py --source-root .
        timeout 120 python3 -B tests/tooling/cmake/check_license_headers.py --source-root .
    - name: Fingerprint the complete Node producer inputs
      id: node-key
      run: |
        echo "NODE_EXPERIMENT_ROOT=$RUNNER_TEMP/node-experiment" >> "$GITHUB_ENV"
        echo "key=$(python3 -B tools/ci/node-experiment.py key)" >> "$GITHUB_OUTPUT"
    - name: Reuse a matching verified AOT and image pair from another run
      id: reuse
      run: python3 -B tools/ci/node-experiment.py restore --root "$NODE_EXPERIMENT_ROOT" --github-output "$GITHUB_OUTPUT"
    - name: Build the fixed Node AOT and Phosh image pair
      if: steps.reuse.outputs.reused != 'true'
      run: bash tools/ci/build-node-experiment.sh "$NODE_EXPERIMENT_ROOT" "${{ steps.node-key.outputs.key }}"
    - uses: actions/upload-artifact@v4
      id: aot-upload
      with:
        name: linux-node-aot
        path: ${{ runner.temp }}/node-experiment/node/aot/
        compression-level: 0
    - uses: actions/upload-artifact@v4
      id: image-upload
      with:
        name: node-phosh-image
        path: ${{ runner.temp }}/node-experiment/image/
        compression-level: 0
    - name: Record reusable references to the original matching artifacts
      if: steps.reuse.outputs.reused != 'true'
      run: python3 -B tools/ci/node-experiment.py record --root "$NODE_EXPERIMENT_ROOT" --aot-artifact "${{ steps.aot-upload.outputs.artifact-id }}" --image-artifact "${{ steps.image-upload.outputs.artifact-id }}"
    - uses: actions/upload-artifact@v4
      if: steps.reuse.outputs.reused != 'true'
      with:
        name: node-experiment-${{ steps.node-key.outputs.key }}
        path: ${{ runner.temp }}/node-experiment/reuse/
        overwrite: true
        if-no-files-found: error
  build-device:
    needs: [inputs, node-image, sdk]
    if: ${{ !cancelled() && needs.inputs.outputs.app == 'true' && needs.node-image.result == 'success' && (needs.sdk.result == 'success' || needs.sdk.result == 'skipped') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/cache/restore@v4
      with:
        path: .build/xtool-sdk-input
        key: ${{ needs.inputs.outputs.sdk_key || needs.sdk.outputs.key }}
        fail-on-cache-miss: true
    - name: Verify SDK content hashes and identity
      run: python3 -B tools/ci/debian-artifacts.py verify --root .build/xtool-sdk-input --kind xtool-sdk --key "${{ needs.inputs.outputs.sdk_key || needs.sdk.outputs.key }}"
    - name: Stage the accepted kernel and boot base
      run: python3 -B tools/ci/stage-debian-runtime.py
    - uses: actions/download-artifact@v4
      with:
        name: linux-node-aot
        path: .build/linux-node-aot
    - name: Select our Node AOT artifact
      run: echo "KERNARIUM_NODE_AOT_ARTIFACT=$PWD/.build/linux-node-aot" >> "$GITHUB_ENV"
    - uses: ./.github/actions/xtool-runtime
    - name: Cross-build the unsigned device IPA with xtool
      run: |
        python3 -B tools/ci/xtool/build-app.py
        mkdir -p "$RUNNER_TEMP/ipa-release"
        cp "$RUNNER_TEMP/Kernarium-Debian.ipa" "$RUNNER_TEMP/ipa-release/"
        python3 -B tools/ci/debian-artifacts.py record --root "$RUNNER_TEMP/ipa-release" --kind ipa --key "$GITHUB_SHA"
        python3 -B tools/ci/debian-artifacts.py verify --root "$RUNNER_TEMP/ipa-release" --kind ipa --key "$GITHUB_SHA"
    - uses: actions/upload-artifact@v4
      with:
        name: app-device
        path: ${{ runner.temp }}/ipa-release/
        if-no-files-found: error
        compression-level: 0
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: xtool-build-diagnostics
        path: Kernarium/xtool/.xtool-tmp/DerivedData/Logs/
        if-no-files-found: warn
  build:
    needs: [inputs, node-image]
    if: needs.inputs.outputs.app == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
        - sdk: simulator
          platform: ios-simulator
          directory: ios-simulator-arm64
          legacy: sim
    runs-on: xcode-27
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Reuse accepted kernel and boot base with source and digest verification
      run: python3 -B tools/ci/stage-debian-runtime.py
    - uses: actions/download-artifact@v4
      with:
        name: linux-node-aot
        path: .build/linux-node-aot
    - name: Select the fixed Node AOT artifact
      run: |
        echo "KERNARIUM_NODE_AOT_ARTIFACT=$PWD/.build/linux-node-aot" >> "$GITHUB_ENV"
        echo "CI_NODE_AOT_SHA256=$(shasum -a 256 .build/linux-node-aot/artifact.json | awk '{print $1}')" >> "$GITHUB_ENV"
    - name: Check framework embedding with the selected Apple tools
      run: |
        python3 - <<'PY'
        import subprocess
        subprocess.run(['python3', '-B', 'tests/tooling/kernarium/test_device_framework_embed.py'],
                       check=True, stdin=subprocess.DEVNULL, timeout=180)
        PY
    - uses: ./.github/actions/apple-runtime
      with:
        sdk: ${{ matrix.sdk }}
        platform: ${{ matrix.platform }}
        platform-directory: ${{ matrix.directory }}
        legacy-prefix: ${{ matrix.legacy }}
    - name: Build the matching Simulator test host
      if: matrix.sdk == 'simulator'
      run: |
        xcodebuild build-for-testing -project Kernarium/Kernarium.xcodeproj -scheme Kernarium -configuration Release \
          -destination 'generic/platform=iOS Simulator' -derivedDataPath "$PWD/.build/simulator-derived" -jobs 3 \
          ENABLE_TESTABILITY=YES CODE_SIGNING_ALLOWED=NO EXCLUDED_ARCHS=x86_64
        python3 -B tools/ci/debian-artifacts.py record --root .build/simulator-derived/Build/Products --kind app-test-host --key "$GITHUB_SHA"
        tar -C .build/simulator-derived/Build -czf "$RUNNER_TEMP/debian-app-test-host.tar.gz" Products
    - uses: actions/upload-artifact@v4
      with:
        name: app-${{ matrix.sdk }}
        path: ${{ runner.temp }}/debian-app-test-host.tar.gz
        if-no-files-found: error
        compression-level: 0
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: apple-cache-${{ matrix.sdk }}
        path: apple-cache-*.json
        if-no-files-found: warn
  tests:
    needs: [inputs, build, build-device, node-image]
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: app-simulator
        path: ${{ runner.temp }}/host
    - name: Verify the matching application test host
      run: |
        XCODE_PATH=$(python3 -c 'import pathlib; p=sorted(pathlib.Path("/Applications").glob("Xcode_27*.app")); print(p[-1] if p else "/Applications/Xcode.app")')
        sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
        mkdir -p .build/test-host
        tar -C .build/test-host -xzf "$RUNNER_TEMP/host/debian-app-test-host.tar.gz"
        python3 -B tools/ci/debian-artifacts.py verify --root .build/test-host/Products --kind app-test-host --key "$GITHUB_SHA"
    - name: Clipboard, native selection and terminal resize tests
      run: python3 -B tools/ci/run-debian-simulator.py --state "$RUNNER_TEMP/simulator-state.json" --products .build/test-host/Products --suite DebianAppTests --output "$RUNNER_TEMP/app-results"
    - name: JIT preference, boot request and real Simulator fallback
      run: |
        rm -f .build/test-host/Products/selected.xctestrun
        python3 -B tools/ci/run-debian-simulator.py --state "$RUNNER_TEMP/simulator-state.json" --products .build/test-host/Products --suite GuestJITTests --output "$RUNNER_TEMP/jit-results"
    - name: Display protocol, request coalescing and phone pixel restoration
      run: |
        rm -f .build/test-host/Products/selected.xctestrun
        python3 -B tools/ci/run-debian-simulator.py --state "$RUNNER_TEMP/simulator-state.json" --products .build/test-host/Products --suite GuestDisplayTests --output "$RUNNER_TEMP/display-native-results"
    - name: Check modifier reset through the application's visible controls
      run: |
        rm -f .build/test-host/Products/selected.xctestrun
        python3 -B tools/ci/run-debian-simulator.py --state "$RUNNER_TEMP/simulator-state.json" --products .build/test-host/Products --ui-case KernariumUITests/testGraphicalModifiersAreReleasedWhenChangingModes --output "$RUNNER_TEMP/ui-results"
    - uses: actions/download-artifact@v4
      with:
        name: node-phosh-image
        path: ${{ runner.temp }}/node-image
    - name: Verify the matching Node experiment disk
      id: golden
      run: |
        python3 -B tools/ci/debian-artifacts.py verify --root "$RUNNER_TEMP/node-image" --kind debian-phosh --key "${{ needs.node-image.outputs.image_key }}"
        mkdir -p "$RUNNER_TEMP/golden-image"
        unzip -q "$RUNNER_TEMP/node-image/debian-13-phosh.img.zip" -d "$RUNNER_TEMP/golden-image"
        cp "$RUNNER_TEMP/node-image/provenance.json" "$RUNNER_TEMP/golden-image/selected-image.json"
    - name: Run preinstalled Node and JavaScript with and without our AOT
      run: |
        rm -f .build/test-host/Products/selected.xctestrun
        python3 -B tools/ci/run-debian-simulator.py --state "$RUNNER_TEMP/simulator-state.json" --products .build/test-host/Products --image "$RUNNER_TEMP/golden-image/debian-13-phosh.img" --suite DebianNodeTests --single-phase --output "$RUNNER_TEMP/node-on-results"
        rm -f .build/test-host/Products/selected.xctestrun
        python3 -B tools/ci/run-debian-simulator.py --state "$RUNNER_TEMP/simulator-state.json" --products .build/test-host/Products --image "$RUNNER_TEMP/golden-image/debian-13-phosh.img" --suite DebianNodeTests --single-phase --aot-off --output "$RUNNER_TEMP/node-off-results"
    - name: Resize the real Phosh desktop and restore the phone without reboot
      run: |
        rm -f .build/test-host/Products/selected.xctestrun
        python3 -B tools/ci/run-debian-simulator.py --state "$RUNNER_TEMP/simulator-state.json" --products .build/test-host/Products --image "$RUNNER_TEMP/golden-image/debian-13-phosh.img" --suite DebianDisplayTests --single-phase --output "$RUNNER_TEMP/display-results"
    - name: Save display diagnostics before the remaining guest checks
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() && steps.golden.outcome == 'success' }}
      with:
        name: ipa-display-diagnostics
        path: ${{ runner.temp }}/display-results/
        if-no-files-found: warn
    - name: Check tmux panes and status from rendered screen pixels
      if: ${{ !cancelled() && steps.golden.outcome == 'success' }}
      run: |
        rm -f .build/test-host/Products/selected.xctestrun
        python3 -B tools/ci/run-debian-simulator.py --state "$RUNNER_TEMP/simulator-state.json" --products .build/test-host/Products --image "$RUNNER_TEMP/golden-image/debian-13-phosh.img" --suite DebianMobileTests --single-phase --output "$RUNNER_TEMP/mobile-results"
    - name: Save graphical and tmux diagnostics before the remaining guest checks
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() && steps.golden.outcome == 'success' }}
      with:
        name: ipa-mobile-diagnostics
        path: ${{ runner.temp }}/mobile-results/
        if-no-files-found: warn
    - name: Preserve the original real Phosh-to-console persistence smoke
      if: ${{ !cancelled() && steps.golden.outcome == 'success' }}
      run: |
        rm -f .build/test-host/Products/selected.xctestrun
        python3 -B tools/ci/run-debian-simulator.py --state "$RUNNER_TEMP/simulator-state.json" --products .build/test-host/Products --image "$RUNNER_TEMP/golden-image/debian-13-phosh.img" --suite PersistentDebianTests --output "$RUNNER_TEMP/persistent-results"
    - name: Increase the disk before boot and check ext4 and data across two reboots
      if: ${{ !cancelled() && steps.golden.outcome == 'success' }}
      run: |
        rm -f .build/test-host/Products/selected.xctestrun
        python3 -B tools/ci/run-debian-simulator.py --state "$RUNNER_TEMP/simulator-state.json" --products .build/test-host/Products --image "$RUNNER_TEMP/golden-image/debian-13-phosh.img" --suite DebianStorageTests --storage --output "$RUNNER_TEMP/storage-results"
    - name: Record actual complete application qualification
      run: |
        python3 - <<'PYTHON'
        import json, os
        from pathlib import Path
        root=Path(os.environ['RUNNER_TEMP'])
        tests={str(path.relative_to(root)):json.loads(path.read_text()) for folder in ('app-results','jit-results','ui-results','persistent-results','mobile-results','storage-results','display-native-results','display-results','node-on-results','node-off-results') for path in (root/folder).glob('*-summary.json')}
        assert len(tests)==13, tests
        for summary in tests.values():
            assert summary['totalTestCount']>0 and summary['passedTests']==summary['totalTestCount']
            assert summary['failedTests']==summary['skippedTests']==0
        qualification=dict(kind='ipa',source_revision=os.environ['GITHUB_SHA'],run_id=os.environ['GITHUB_RUN_ID'],image=json.loads((root/'golden-image/selected-image.json').read_text()),tests=tests)
        (root/'app-qualification.json').write_text(json.dumps(qualification,indent=2)+'\n')
        PYTHON
    - uses: actions/upload-artifact@v4
      with:
        name: ipa-qualification
        path: ${{ runner.temp }}/app-qualification.json
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ipa-test-diagnostics
        path: |
          ${{ runner.temp }}/app-results/
          ${{ runner.temp }}/ui-results/
          ${{ runner.temp }}/persistent-results/
          ${{ runner.temp }}/mobile-results/
          ${{ runner.temp }}/storage-results/

          ${{ runner.temp }}/node-on-results/
          ${{ runner.temp }}/node-off-results/
          ${{ runner.temp }}/jit-results/
          ${{ runner.temp }}/display-native-results/
          ${{ runner.temp }}/display-results/
        if-no-files-found: warn
    - name: Clean up the shared test Simulator
      if: always()
      run: python3 -B tools/ci/run-debian-simulator.py --cleanup --state "$RUNNER_TEMP/simulator-state.json" --products .build/test-host/Products --output "$RUNNER_TEMP/cleanup"
  timings:
    if: always()
    needs:
    - inputs
    - build
    - build-device
    - tests
    - jit-memory
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
    - uses: actions/checkout@v4
    - name: Report actual stage durations
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 -B tools/ci/debian-run-report.py
    - uses: actions/upload-artifact@v4
      with:
        name: ipa-stage-times
        path: debian-stage-times.json
  jit-memory:
    needs: inputs
    if: needs.inputs.outputs.runtime_tests == 'true'
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Fingerprint the pinned native unit dependency
      id: unit-deps-key
      run: |
        brew install cmake ninja
        echo "key=$(python3 -B tools/ci/jit-unit-deps.py --key)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache/restore@v4
      id: unit-deps
      with:
        path: .build/dependencies/jit-unit-zlib
        key: jit-unit-zlib-v1-${{ runner.arch }}-${{ steps.unit-deps-key.outputs.key }}
    - name: Build the verified native zlib only when absent
      if: steps.unit-deps.outputs.cache-hit != 'true'
      run: python3 -B tools/ci/jit-unit-deps.py --build --input-key "${{ steps.unit-deps-key.outputs.key }}"
    - name: Verify native dependency hashes and source identity
      run: python3 -B tools/ci/debian-artifacts.py verify --root .build/dependencies/jit-unit-zlib --kind jit-unit-zlib --key "${{ steps.unit-deps-key.outputs.key }}"
    - uses: actions/cache/save@v4
      if: steps.unit-deps.outputs.cache-hit != 'true'
      with:
        path: .build/dependencies/jit-unit-zlib
        key: ${{ steps.unit-deps.outputs.cache-primary-key }}
    - name: Build and check the executable-memory owner
      run: |
        test "$(uname -m)" = arm64
        cmake --preset macos-arm64-unit -DUML_DEPENDENCY_PREFIX="$PWD/.build/dependencies/jit-unit-zlib"
        cmake --build --preset jit-memory-test-binaries --parallel 3
        ctest --preset jit-memory --output-junit "$RUNNER_TEMP/jit-memory.xml"
        python3 - <<'PYTHON'
        import os, xml.etree.ElementTree as ET
        from pathlib import Path
        root=ET.parse(Path(os.environ['RUNNER_TEMP'])/'jit-memory.xml').getroot()
        tests=root.findall('.//testcase')
        selected={t.attrib['name'] for t in tests if t.attrib['name'].startswith('arm64-jit-')}
        expected={'arm64-jit-debugger-region','arm64-jit-debugger-request','arm64-jit-enabled-process','arm64-jit-memory-preparation'}
        assert selected==expected,selected
        assert all(t.find('failure') is None and t.find('skipped') is None for t in tests)
        print('ACTUAL_JIT_MEMORY_TESTS:',len(selected),'passed; zero failed or skipped')
        PYTHON
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: jit-memory-native-results
        path: ${{ runner.temp }}/jit-memory.xml
        if-no-files-found: warn
'on':
  push:
    branches:
    - debian-phosh
  pull_request:
    branches:
    - debian-phosh-upstream-20261123
    - feature/linux-node-aot
  workflow_dispatch: null
