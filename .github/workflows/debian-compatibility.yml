# SPDX-License-Identifier: GPL-2.0-or-later
name: Debian IPA and IMG compatibility
permissions:
  contents: read
  actions: read
jobs:
  compatibility:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      APP_RUN: ${{ inputs.app_run_id }}
      IMAGE_ARTIFACT: ${{ inputs.image_artifact_id }}
    steps:
    - uses: actions/checkout@v4
    - name: Select Xcode
      run: |
        XCODE_PATH=$(python3 -c 'import pathlib; p=sorted(pathlib.Path("/Applications").glob("Xcode_27*.app")); print(p[-1] if p else "/Applications/Xcode.app")')
        sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
    - name: Fetch and verify the chosen existing products
      run: |
        python3 -B tools/ci/fetch-debian-app.py --run-id "$APP_RUN" --output "$RUNNER_TEMP/app"
        python3 -B tools/ci/qualified-debian-image.py --artifact-id "$IMAGE_ARTIFACT" --output "$RUNNER_TEMP/image"
    - name: Real boot and persistence with the selected app build and disk
      run: |
        python3 -B tools/ci/run-debian-simulator.py --products "$RUNNER_TEMP/app/Products" --image "$RUNNER_TEMP/image/debian-13-phosh.img" --suite PersistentDebianTests --output "$RUNNER_TEMP/pair-results"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: chosen-product-compatibility
        path: ${{ runner.temp }}/pair-results/
        if-no-files-found: warn
'on':
  workflow_dispatch:
    inputs:
      app_run_id:
        description: Actions run ID containing the existing IPA and matching Simulator host
        required: true
        type: string
      image_artifact_id:
        description: Existing qualified-image-phosh Actions artifact ID
        required: true
        type: string
