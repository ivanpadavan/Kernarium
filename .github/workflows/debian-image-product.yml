name: Debian image product
'on':
  workflow_call:
    inputs:
      kind:
        required: true
        type: string
      input_key:
        required: true
        type: string
      base_key:
        required: true
        type: string
    secrets:
      DEBIAN_RELEASE_TOKEN:
        required: false
permissions:
  contents: write
jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      PRODUCT: debian-13-${{ inputs.kind }}
      INPUT_KEY: ${{ inputs.input_key }}
      TAG: debian-13-${{ inputs.kind }}-${{ github.run_id }}-${{ github.run_attempt }}
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: debian-common-base
        path: ${{ runner.temp }}/debian-base
    - uses: actions/cache/restore@v4
      id: image
      with:
        path: ${{ runner.temp }}/image-release
        key: debian-img-v2-${{ inputs.kind }}-${{ runner.arch }}-${{ env.INPUT_KEY }}
    - name: Build only the selected product from the verified base
      if: steps.image.outputs.cache-hit != 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends build-essential cpio curl debootstrap e2fsprogs gdisk gzip python3 sudo tar zip unzip
        python3 -B tools/ci/debian-artifacts.py verify --root "$RUNNER_TEMP/debian-base" --kind debian-base --key '${{ inputs.base_key }}'
        tools/rootfs/starter/build-all.sh --work "$RUNNER_TEMP/image-work" --output "$RUNNER_TEMP/image-release" --product "$PRODUCT" --debian-base "$RUNNER_TEMP/debian-base/debian-13-base.tar.gz"
        python3 -B tools/rootfs/starter/gpt.py "$RUNNER_TEMP/image-release/$PRODUCT.img"
        zip -9 -j "$RUNNER_TEMP/image-release/$PRODUCT.img.zip" "$RUNNER_TEMP/image-release/$PRODUCT.img"
        unzip -t "$RUNNER_TEMP/image-release/$PRODUCT.img.zip"
        rm "$RUNNER_TEMP/image-release/$PRODUCT.img"
        python3 -B tools/ci/debian-artifacts.py record --root "$RUNNER_TEMP/image-release" --kind "debian-${{ inputs.kind }}" --key "$INPUT_KEY"
    - name: Verify image delivery hashes and source provenance
      run: |
        python3 -B tools/ci/debian-artifacts.py verify --root "$RUNNER_TEMP/image-release" --kind "debian-${{ inputs.kind }}" --key "$INPUT_KEY"
    - name: Make checked IMG draft assets available immediately
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.DEBIAN_RELEASE_TOKEN || github.token }}
      run: |
        gh release create "$TAG" --target "$GITHUB_SHA" --draft --title "$PRODUCT" --notes "Integrity checked. Guest boot qualification is running. Draft assets are available for testing."
        gh release upload "$TAG" "$RUNNER_TEMP/image-release/"*
    - uses: actions/cache/save@v4
      if: steps.image.outputs.cache-hit != 'true'
      with:
        path: ${{ runner.temp }}/image-release
        key: ${{ steps.image.outputs.cache-primary-key }}
    - uses: actions/upload-artifact@v4
      with:
        name: image-${{ inputs.kind }}
        path: ${{ runner.temp }}/image-release/
        compression-level: 0
  boot:
    needs: image
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: debian-13-${{ inputs.kind }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: image-${{ inputs.kind }}
        path: ${{ runner.temp }}/image-release
    - name: Fetch a qualified prebuilt image validator
      run: |
        XCODE_PATH=$(python3 -c 'import pathlib; p=sorted(pathlib.Path("/Applications").glob("Xcode_27*.app")); print(p[-1] if p else "/Applications/Xcode.app")')
        sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
        mkdir -p .build/validator
        gh release download debian-validation-host-44954236479 --dir .build/validator --pattern debian-validation-host.tar.gz --pattern qualification.json
        echo 'a388c8b2fc3e12a257e289f8529b0a22a14b19f77d00dece66ccadb73a3e93cb  .build/validator/debian-validation-host.tar.gz' | shasum -a 256 -c -
        tar -C .build/validator -xzf .build/validator/debian-validation-host.tar.gz
        python3 -B tools/ci/debian-artifacts.py verify --root .build/validator/Products --kind validation-host --key b185c4198dfbf5d13cf7142d2e7bfacfd565a4e3
        python3 -B tools/ci/debian-artifacts.py verify --root "$RUNNER_TEMP/image-release" --kind 'debian-${{ inputs.kind }}' --key '${{ inputs.input_key }}'
        unzip -q "$RUNNER_TEMP/image-release/debian-13-${{ inputs.kind }}.img.zip" -d "$RUNNER_TEMP"
    - name: Real guest boots, clipboard, TTY and persistence
      run: |
        python3 -B tools/ci/run-debian-simulator.py --products .build/validator/Products --image "$RUNNER_TEMP/debian-13-${{ inputs.kind }}.img" --kind '${{ inputs.kind }}' --features --output "$RUNNER_TEMP/boot-results"
    - name: Publish only a completely qualified image
      run: |
        python3 - <<'PY'
        import json, os
        from pathlib import Path
        root = Path(os.environ['RUNNER_TEMP'])
        provenance = json.loads((root / 'image-release/provenance.json').read_text())
        qualification = dict(kind='debian-${{ inputs.kind }}', source_revision=provenance['source_revision'],
          validator_revision=os.environ['GITHUB_SHA'],
          input_key='${{ inputs.input_key }}',
          run_id=os.environ['GITHUB_RUN_ID'], tests={phase: json.loads((root / 'boot-results' / (phase + '-summary.json')).read_text()) for phase in ('write', 'read')})
        (root / 'qualification.json').write_text(json.dumps(qualification, indent=2) + '\n')
        PY
        if ! gh release view "$TAG" >/dev/null 2>&1; then
          gh release create "$TAG" --target "$GITHUB_SHA" --draft --title 'Qualified Debian image' --notes 'Guest boot tests passed.'
          gh release upload "$TAG" "$RUNNER_TEMP/image-release/"*
        fi
        gh release upload "$TAG" "$RUNNER_TEMP/qualification.json"
        gh release edit "$TAG" --draft=false --prerelease --notes "Real Simulator guest boot, local login, TTY sizing, write/read persistence and clean shutdown passed. Phosh additionally checks GUI frames, clipboard UTF-8 roundtrip and automatic Squeekboard startup. Physical iPhone gesture checks remain separate."
      env:
        GH_TOKEN: ${{ secrets.DEBIAN_RELEASE_TOKEN || github.token }}
    - name: Preserve failures and actual test counts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: img-boot-${{ inputs.kind }}
        path: |
          ${{ runner.temp }}/boot-results/
        if-no-files-found: warn
