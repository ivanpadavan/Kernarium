# SPDX-License-Identifier: GPL-2.0-or-later
name: Debian Phosh for iPhone
on:
  workflow_dispatch:
  push:
    branches: [debian-phosh]
permissions:
  contents: write
concurrency:
  group: debian-phosh-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Create draft download location
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "debian-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --target "$GITHUB_SHA" --draft \
            --title "Debian Phosh ${GITHUB_SHA::7}" \
            --notes "CI build in progress. IPA and rootfs are published after successful packaging; boot/persistence test results follow."
  rootfs:
    needs: release
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: rootfs-cache
        with:
          path: ${{ runner.temp }}/starter-release
          key: debian-phosh-zip-v1-${{ hashFiles('tools/rootfs/**', 'tools/ci/accept-boot-base.py') }}
      - name: Install native ARM64 rootfs build tools
        if: steps.rootfs-cache.outputs.cache-hit != 'true'
        run: |
          test "$(uname -m)" = aarch64
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex cpio curl debootstrap e2fsprogs gdisk \
            gzip libncurses-dev patch perl python3 rsync sudo tar unzip wget \
            file git zip
      - name: Build Debian Phosh and its boot base
        if: steps.rootfs-cache.outputs.cache-hit != 'true'
        run: |
          tools/rootfs/starter/build-all.sh \
            --work "$RUNNER_TEMP/starter-work" --output "$RUNNER_TEMP/starter-release" \
            --jobs 4 --product boot-base-aarch64 --product debian-13-phosh
      - name: Audit and accept this run's boot base
        if: steps.rootfs-cache.outputs.cache-hit != 'true'
        run: |
          python3 -B tools/ci/accept-boot-base.py \
            --archive "$RUNNER_TEMP/starter-release/uml-boot-base-aarch64.cpio.gz" \
            --release "debian-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output "$RUNNER_TEMP/starter-release/accepted-aarch64.env"
          python3 -B tools/rootfs/starter/gpt.py "$RUNNER_TEMP/starter-release/debian-13-phosh.img"
          zip -9 -j "$RUNNER_TEMP/starter-release/debian-13-phosh.img.zip" \
            "$RUNNER_TEMP/starter-release/debian-13-phosh.img"
          rm "$RUNNER_TEMP/starter-release/debian-13-phosh.img"
          python3 -c 'from pathlib import Path; import sys; files=list(Path(sys.argv[1]).iterdir()); assert all(p.stat().st_size < 2**31 for p in files), "Release asset exceeds 2 GiB"' "$RUNNER_TEMP/starter-release"
      - name: Revalidate rootfs delivery inputs
        run: |
          python3 -B tools/rootfs/boot-ramdisk/verify_base.py \
            --descriptor "$RUNNER_TEMP/starter-release/accepted-aarch64.env" \
            --archive "$RUNNER_TEMP/starter-release/uml-boot-base-aarch64.cpio.gz"
          python3 -c 'from pathlib import Path; import sys; assert all(p.stat().st_size < 2**31 for p in Path(sys.argv[1]).iterdir()), "Release asset exceeds 2 GiB"' "$RUNNER_TEMP/starter-release"
      - name: Upload rootfs assets to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "debian-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            "$RUNNER_TEMP/starter-release/"* --clobber
  kernel:
    needs: release
    runs-on: xcode-27
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: kernel-cache
        with:
          path: ${{ runner.temp }}/linux-kernel.tar.gz
          key: linux-kernel-v1-${{ hashFiles('kernel/**', 'dependencies/**', 'scripts/**') }}
      - name: Install kernel producer host tools
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: |
          test "$(uname -m)" = arm64
          brew install cmake ninja make meson pkgconf autoconf automake libtool \
            gettext gperf groff bison flex llvm lld rsync
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
      - name: Prepare isolated case-sensitive kernel filesystem
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: |
          hdiutil create -size 24g -type SPARSE -fs HFSX \
            -volname KernariumKernel "$RUNNER_TEMP/kernel.sparseimage"
          df -h "$PWD" "$RUNNER_TEMP"
          # A sparse image supplies case sensitivity, not extra physical disk.
          mkdir "$RUNNER_TEMP/kernel-volume"
          hdiutil attach "$RUNNER_TEMP/kernel.sparseimage" \
            -mountpoint "$RUNNER_TEMP/kernel-volume" -nobrowse
          printf 'UML_KERNEL_SOURCE_DIR=%s/linux\n' "$RUNNER_TEMP/kernel-volume" \
            > kernel/mainline-6.18/source-location.conf
      - name: Identify kernel producer inputs
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        id: kernel-inputs
        run: |
          . kernel/mainline-6.18/patches/metadata.env
          echo "upstream=$UML_KERNEL_UPSTREAM_COMMIT" >> "$GITHUB_OUTPUT"
          echo "toolchain=$(tools/ci/apple-toolchain-key.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        id: kernel-host-sources
        with:
          path: |
            external/sources
            .build/dependency-cache
          key: kernel-host-sources-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dependencies/**', 'scripts/patch_series.py') }}
      - name: Prepare and verify pinned kernel host-tool sources
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: |
          if ! git var GIT_COMMITTER_IDENT >/dev/null 2>&1; then
            git config --global user.name "$(git log -1 --format=%cn)"
            git config --global user.email "$(git log -1 --format=%ce)"
          fi
          dependencies/prepare.sh --product kernel-host-tools
          dependencies/prepare.sh --archive-manifest dependencies/kernel-host-tools/archives.tsv
      - uses: actions/cache/save@v4
        if: steps.kernel-cache.outputs.cache-hit != 'true' && steps.kernel-host-sources.outputs.cache-hit != 'true'
        with:
          path: |
            external/sources
            .build/dependency-cache
          key: ${{ steps.kernel-host-sources.outputs.cache-primary-key }}
      - uses: actions/cache/restore@v4
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        id: kernel-host-tools
        with:
          path: .build/dependencies/kernel-host-tools
          key: kernel-host-tools-v1-${{ runner.arch }}-${{ steps.kernel-inputs.outputs.toolchain }}-${{ hashFiles('dependencies/**', 'kernel/mainline-6.18/build/toolchain/darwin-host/**', 'tools/ci/apple-toolchain-key.sh') }}
      - name: Build or fully verify kernel host tools
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: dependencies/build-kernel-host-tools.sh --jobs 3
      - uses: actions/cache/save@v4
        if: steps.kernel-cache.outputs.cache-hit != 'true' && steps.kernel-host-tools.outputs.cache-hit != 'true'
        with:
          path: .build/dependencies/kernel-host-tools
          key: ${{ steps.kernel-host-tools.outputs.cache-primary-key }}
      - uses: actions/cache/restore@v4
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        id: linux-source-download
        with:
          path: ${{ runner.temp }}/kernel-volume/cache
          key: linux-upstream-v1-${{ steps.kernel-inputs.outputs.upstream }}
      - name: Prepare and verify the pinned Linux source
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: |
          kernel/mainline-6.18/scripts/prepare-source.sh --slice arm64 \
            --cache "$RUNNER_TEMP/kernel-volume/cache"
      - uses: actions/cache/save@v4
        if: steps.kernel-cache.outputs.cache-hit != 'true' && steps.linux-source-download.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/kernel-volume/cache
          key: ${{ steps.linux-source-download.outputs.cache-primary-key }}
      - name: Build and validate Linux kernel artifact
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: |
          kernel/mainline-6.18/build/build-kernel.sh --product linux --slice arm64 \
            --build "$RUNNER_TEMP/kernel-volume/build" --jobs 3
          KERNEL_RELEASE_ID="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python3 -B kernel/mainline-6.18/build/publish-artifact.py \
            --source "$RUNNER_TEMP/kernel-volume/linux" \
            --build "$RUNNER_TEMP/kernel-volume/build" --slice arm64 --product linux \
            --output-root "$PWD/.build/kernel/artifacts" \
            --release-id "$KERNEL_RELEASE_ID" \
            --objcopy "$(brew --prefix llvm)/bin/llvm-objcopy"
          tar -C .build/kernel/artifacts -czf "$RUNNER_TEMP/linux-kernel.tar.gz" \
            "mainline-6.18-arm64-4k-$KERNEL_RELEASE_ID"
      - name: Revalidate and stage the CI kernel distribution
        run: |
          mkdir -p .build/kernel/artifacts
          tar -C .build/kernel/artifacts -xzf "$RUNNER_TEMP/linux-kernel.tar.gz"
          CI_KERNEL_DIRECTORY=$(python3 -B tools/ci/stage-kernel.py \
            --input-root "$PWD/.build/kernel/artifacts" \
            --output-root "$PWD/.build/kernel/ci-artifacts" \
            --release-id "ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")
          tar -C .build/kernel/ci-artifacts -czf "$RUNNER_TEMP/linux-kernel-ci.tar.gz" "$CI_KERNEL_DIRECTORY"
          python3 -c 'from pathlib import Path; import sys; assert Path(sys.argv[1]).stat().st_size < 2**31, "Kernel asset exceeds 2 GiB"' "$RUNNER_TEMP/linux-kernel-ci.tar.gz"
          df -h "$PWD" "$RUNNER_TEMP"
      - name: Upload validated kernel artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "debian-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            "$RUNNER_TEMP/linux-kernel-ci.tar.gz" --clobber
  iphone:
    needs: [rootfs, kernel]
    runs-on: xcode-27
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27 and install build tools
        run: |
          test "$(uname -m)" = arm64
          XCODE_PATH=$(python3 -c 'import pathlib; p=sorted(pathlib.Path("/Applications").glob("Xcode_27*.app")); print(p[-1] if p else "/Applications/Xcode.app")')
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version | awk -F. '$1 >= 27 { ok=1 } END { exit !ok }'
          xcodebuild -downloadComponent MetalToolchain
          brew install cmake ninja make meson pkgconf autoconf automake libtool \
            gettext gperf groff bison flex rsync
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Install documented Python GPU build tools
        run: |
          python3 -m venv .build/gpu-tools-venv
          .build/gpu-tools-venv/bin/python -m pip install meson Mako PyYAML packaging
          # The GPU builder intentionally narrows PATH to this tool directory.
          ln -s "$(brew --prefix bison)/bin/bison" .build/gpu-tools-venv/bin/bison
          ln -s "$(brew --prefix flex)/bin/flex" .build/gpu-tools-venv/bin/flex
          echo "$PWD/.build/gpu-tools-venv/bin" >> "$GITHUB_PATH"
      - name: Download validated CI inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .build/ci-download .build/kernel/artifacts
          gh release download "debian-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --dir .build/ci-download
          tar -C .build/kernel/artifacts -xzf .build/ci-download/linux-kernel-ci.tar.gz
          CI_KERNEL_DIRECTORY=$(python3 -c 'from pathlib import Path; p=list(Path(".build/kernel/artifacts").glob("*/kernel-artifact.json")); assert len(p)==1; print(p[0].parent.name)')
          python3 -B kernel/common/artifacts/verify-kernel-artifact.py \
            --artifact "$PWD/.build/kernel/artifacts/$CI_KERNEL_DIRECTORY" \
            --common-root "$PWD/kernel/common" \
            --abi-metadata "$PWD/kernel/common/abi/identity.env" \
            --kernel-metadata "$PWD/kernel/mainline-6.18/patches/metadata.env"
          echo "UML_MAINLINE_618_KERNEL_ARTIFACT_DIR=$PWD/.build/kernel/artifacts/$CI_KERNEL_DIRECTORY" >> "$GITHUB_ENV"
          cp .build/ci-download/accepted-aarch64.env tools/rootfs/boot-ramdisk/accepted-aarch64.env
          . tools/rootfs/boot-ramdisk/accepted-aarch64.env
          mkdir -p ".build/rootfs/$UML_BOOT_BASE_RELEASE"
          cp .build/ci-download/uml-boot-base-aarch64.cpio.gz ".build/rootfs/$UML_BOOT_BASE_RELEASE/"
          python3 -B tools/rootfs/boot-ramdisk/verify_base.py \
            --descriptor tools/rootfs/boot-ramdisk/accepted-aarch64.env \
            --archive ".build/rootfs/$UML_BOOT_BASE_RELEASE/uml-boot-base-aarch64.cpio.gz"
      - name: Fingerprint the selected Apple build environment
        id: ios-toolchain
        run: echo "key=$(tools/ci/apple-toolchain-key.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: ios-sources
        with:
          path: |
            external/sources
            .build/dependency-cache
          key: ios-sources-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dependencies/**', 'tools/rootfs/vulkan/**', 'scripts/patch_series.py') }}
      - name: Prepare and verify pinned iOS sources
        run: |
          if ! git var GIT_COMMITTER_IDENT >/dev/null 2>&1; then
            git config --global user.name "$(git log -1 --format=%cn)"
            git config --global user.email "$(git log -1 --format=%ce)"
          fi
          for product in apple-gpu-vulkan-experiment ios-network ios-storage ios-compression; do
            dependencies/prepare.sh --product "$product"
          done
      - uses: actions/cache/save@v4
        if: steps.ios-sources.outputs.cache-hit != 'true'
        with:
          path: |
            external/sources
            .build/dependency-cache
          key: ${{ steps.ios-sources.outputs.cache-primary-key }}
      - uses: actions/cache/restore@v4
        id: ios-gpu
        with:
          path: .build/dependencies/apple-gpu-vulkan-experiment/ios-device-arm64
          key: ios-gpu-v1-${{ runner.arch }}-${{ steps.ios-toolchain.outputs.key }}-${{ hashFiles('dependencies/**', 'tools/rootfs/vulkan/**', 'tools/ci/apple-toolchain-key.sh') }}
      - name: Build or fully verify iOS gpu dependencies
        run: dependencies/build-apple-gpu.sh --platform ios --jobs 3
      - uses: actions/cache/save@v4
        if: steps.ios-gpu.outputs.cache-hit != 'true'
        with:
          path: .build/dependencies/apple-gpu-vulkan-experiment/ios-device-arm64
          key: ${{ steps.ios-gpu.outputs.cache-primary-key }}
      - uses: actions/cache/restore@v4
        id: ios-network
        with:
          path: .build/dependencies/ios-device-arm64/network
          key: ios-network-v1-${{ runner.arch }}-${{ steps.ios-toolchain.outputs.key }}-${{ hashFiles('dependencies/**', 'tools/ci/apple-toolchain-key.sh') }}
      - name: Build or fully verify iOS network dependencies
        run: dependencies/build-ios-network.sh --platform ios --jobs 3
      - uses: actions/cache/save@v4
        if: steps.ios-network.outputs.cache-hit != 'true'
        with:
          path: .build/dependencies/ios-device-arm64/network
          key: ${{ steps.ios-network.outputs.cache-primary-key }}
      - uses: actions/cache/restore@v4
        id: ios-storage
        with:
          path: .build/dependencies/ios-storage
          key: ios-storage-v1-${{ runner.arch }}-${{ steps.ios-toolchain.outputs.key }}-${{ hashFiles('dependencies/**', 'tools/ci/apple-toolchain-key.sh') }}
      - name: Build or fully verify iOS storage dependencies
        run: dependencies/build-ios-storage.sh
      - uses: actions/cache/save@v4
        if: steps.ios-storage.outputs.cache-hit != 'true'
        with:
          path: .build/dependencies/ios-storage
          key: ${{ steps.ios-storage.outputs.cache-primary-key }}
      - uses: actions/cache/restore@v4
        id: ios-compression
        with:
          path: .build/dependencies/ios-zstd
          key: ios-compression-v1-${{ runner.arch }}-${{ steps.ios-toolchain.outputs.key }}-${{ hashFiles('dependencies/**', 'tools/ci/apple-toolchain-key.sh') }}
      - name: Build or fully verify iOS compression dependencies
        run: dependencies/build-ios-zstd.sh
      - uses: actions/cache/save@v4
        if: steps.ios-compression.outputs.cache-hit != 'true'
        with:
          path: .build/dependencies/ios-zstd
          key: ${{ steps.ios-compression.outputs.cache-primary-key }}
      - name: Build Linux runtime and package frameworks
        run: |
          cmake --preset kernarium-ios-device \
            -DUML_MAINLINE_618_KERNEL_ARTIFACT_DIR="$UML_MAINLINE_618_KERNEL_ARTIFACT_DIR"
          cmake --build --preset kernarium-ios-device --parallel 3
          Kernarium/scripts/package-ios-frameworks.sh --sdk device --runtimes linux
      - name: Release producer intermediates and report disk budget
        run: |
          # These are this runner's disposable producer trees, never source or user data.
          rm -rf .build/dependency-build .build/dependency-cache
          df -h "$PWD" "$RUNNER_TEMP"
          du -sh .build external/sources
      - name: Build unsigned iPhone application
        run: |
          xcodebuild -resolvePackageDependencies -project Kernarium/Kernarium.xcodeproj -scheme Kernarium
          xcodebuild -project Kernarium/Kernarium.xcodeproj -scheme Kernarium \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/.build/iphone-derived" -jobs 3 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          mkdir -p .build/ipa/Payload
          cp -R .build/iphone-derived/Build/Products/Release-iphoneos/Kernarium.app .build/ipa/Payload/
          (cd .build/ipa && zip -qry ../Kernarium-Debian.ipa Payload)
      - name: Publish built IPA and rootfs before smoke tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c 'from pathlib import Path; assert Path(".build/Kernarium-Debian.ipa").stat().st_size < 2**31, "IPA exceeds 2 GiB"'
          gh release upload "debian-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" .build/Kernarium-Debian.ipa --clobber
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          root = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
          commit = os.environ["GITHUB_SHA"]
          guide = (
              "Unsigned Kernarium IPA for SideStore; current upstream requires iOS 27+ and Metal 4.\n\n"
              "Unzip debian-13-phosh.img.zip in Files and place debian-13-phosh.img in Kernarium Documents. "
              "The disk persists; replacing it replaces its guest data. The Start graphical desktop setting "
              "selects Phosh or the console for the next launch. Local user debian has passwordless sudo; "
              "use sudo passwd debian before using the lock screen. SSH accepts owner-installed public keys.\n\n"
              f"[Installation and storage guide]({root}/blob/{commit}/Kernarium/README.md)\n\n"
              f"[CI run]({root}/actions/runs/{os.environ['GITHUB_RUN_ID']}) | [Sources]({root}/tree/{commit})\n"
          )
          Path(".build/release-guide.md").write_text(guide)
          Path(".build/release-notes.md").write_text(
              "Build and packaging succeeded. Boot and persistence smoke tests are still running; "
              "this release will be updated with their results. Physical iPhone and LiveContainer behavior "
              "is unverified.\n\n" + guide)
          PYTHON
          gh release edit "debian-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --draft=false --prerelease --notes-file .build/release-notes.md
      - name: Bootstrap app container on the Mac
        run: |
          xcodebuild -project Kernarium/Kernarium.xcodeproj -scheme Kernarium \
            -configuration Release -destination 'platform=macOS,variant=Designed for iPad' \
            -derivedDataPath "$PWD/.build/kernarium-xcode-derived" -jobs 3 \
            -only-testing:KernariumTests/PersistentDebianTests \
            -only-testing:KernariumTests/KernariumTests/rootfsSelectionAcceptsOnlyDocumentsFilenames \
            -only-testing:KernariumTests/KernariumTests/linuxBootSelectionPersistsAndEnvironmentOverridesOneLaunch \
            ENABLE_TESTABILITY=YES CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            CODE_SIGNING_REQUIRED=NO test
      - name: Boot Phosh, write persistent data, shut down
        run: |
          unzip -q .build/ci-download/debian-13-phosh.img.zip -d .build/ci-download
          rm .build/ci-download/debian-13-phosh.img.zip
          python3 - <<'PYTHON'
          import hashlib, json
          from pathlib import Path
          root = Path(".build/ci-download")
          image = root / "debian-13-phosh.img"
          expected = json.loads((root / "release-manifest.json").read_text())["artifacts"][image.name]
          with image.open("rb") as source:
              actual = hashlib.file_digest(source, "sha256").hexdigest()
          assert image.stat().st_size == expected["size"] and actual == expected["sha256"]
          PYTHON
          df -h "$PWD"
          Kernarium/scripts/run-ios-mac.sh --no-build --ad-hoc \
            --rootfs "$PWD/.build/ci-download/debian-13-phosh.img" \
            --only-testing KernariumTests/PersistentDebianTests \
            --test-env KERNARIUM_DEBIAN_SMOKE=write \
            --test-env KERNARIUM_LINUX_CONSOLE_BOOT=0
      - name: Boot console from the same disk and verify data
        run: |
          Kernarium/scripts/run-ios-mac.sh --no-build --ad-hoc \
            --rootfs "$PWD/.build/ci-download/debian-13-phosh.img" \
            --only-testing KernariumTests/PersistentDebianTests \
            --test-env KERNARIUM_DEBIAN_SMOKE=read \
            --test-env KERNARIUM_LINUX_CONSOLE_BOOT=1
      - uses: actions/cache/restore@v4
        id: macos-test-sources
        with:
          path: |
            external/sources
            .build/dependency-cache
          key: macos-test-sources-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dependencies/**', 'scripts/patch_series.py') }}
      - name: Prepare and verify the canonical macOS test sources
        run: dependencies/prepare.sh --product macos
      - uses: actions/cache/save@v4
        if: steps.macos-test-sources.outputs.cache-hit != 'true'
        with:
          path: |
            external/sources
            .build/dependency-cache
          key: ${{ steps.macos-test-sources.outputs.cache-primary-key }}
      - uses: actions/cache/restore@v4
        id: macos-test-prefix
        with:
          path: .build/dependencies/macos-arm64-27
          key: macos-test-prefix-v1-${{ runner.arch }}-${{ steps.ios-toolchain.outputs.key }}-${{ hashFiles('dependencies/**', 'darwin/cpu/x86_64/**', 'cmake/**', 'tools/ci/apple-toolchain-key.sh') }}
      - name: Build or fully verify the canonical macOS test prefix
        run: dependencies/build.sh --jobs 3
      - uses: actions/cache/save@v4
        if: steps.macos-test-prefix.outputs.cache-hit != 'true'
        with:
          path: .build/dependencies/macos-arm64-27
          key: ${{ steps.macos-test-prefix.outputs.cache-primary-key }}
      - name: Check host boot contracts
        run: |
          cmake --preset macos-unit
          cmake --build --preset unit-test-binaries --parallel 3
          ctest --test-dir .build/presets/macos-unit --output-on-failure -R 'kernarium-(loader-|settle-plumbing|console-)|kernarium-device-framework-|boot-initramfs|rootfs-boot-base|rootfs-starter|andarium-stage-system-image'
      - name: Mark boot and persistence tests passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c 'from pathlib import Path; p=Path(".build"); (p/"release-notes.md").write_text("Build and both boot/persistence smoke tests passed on the iOS runtime on an Apple silicon Mac. Physical iPhone and LiveContainer behavior is unverified.\n\n" + (p/"release-guide.md").read_text())'
          gh release edit "debian-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --notes-file .build/release-notes.md
      - name: Report a failed check on an already published build
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f .build/release-guide.md ] && [ "$(gh release view "debian-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --json isDraft --jq .isDraft)" = false ]; then
            python3 -c 'from pathlib import Path; p=Path(".build"); (p/"release-notes.md").write_text("Build succeeded, but a subsequent CI check or boot/persistence smoke test failed. This is an experimental build; see the linked run for the failure. Physical iPhone and LiveContainer behavior is unverified.\n\n" + (p/"release-guide.md").read_text())'
            gh release edit "debian-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --notes-file .build/release-notes.md
          fi
