# SPDX-License-Identifier: GPL-2.0-or-later
name: Stop superseded Debian test candidates
on:
  push:
    branches: [debian-phosh]
    paths: [.github/workflows/stop-superseded-tests.yml]
permissions:
  actions: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
    - name: Preserve built artifacts and stop only obsolete test candidates
      run: |
        for run in 44965982908 44966243878 44967145979 44967553744; do
          status=$(gh api "repos/$GH_REPO/actions/runs/$run" --jq .status)
          if [ "$status" != completed ]; then
            gh run cancel "$run" --repo "$GH_REPO"
          fi
        done
